<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Mío Fashion</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/tema.js"></script>
</head>
<body class="bg-white text-neutral-900 font-sans">

  <header class="border-b border-neutral-200">
          <ul class="flex flex-wrap justify-center gap-x-6 gap-y-2 w-full order-last text-sm md:order-none md:w-auto md:justify-start md:gap-8">
     <a href="index.html"><img src="img/logo.png" alt="Mío Fashion" class="h-14 w-auto"></a>
            <ul id="menu-principal" class="hidden flex flex-col fixed inset-0 z-50 bg-white justify-center gap-3 px-8 md:static md:z-auto md:inset-auto md:flex md:flex-row md:gap-8 md:p-0">
        <li class="absolute top-5 right-6 md:hidden">
                  <button id="btn-tema" class="text-sm border border-neutral-300 px-3 py-2 rounded-full hover:border-pink-600" aria-label="Cambiar tema">🌙</button>
          <button id="btn-cerrar-menu" class="text-4xl leading-none" aria-label="Cerrar menú">✕</button>
        </li>
        <li><a href="index.html" class="block rounded-xl px-5 py-4 text-2xl text-neutral-800 active:bg-[#FF8DA1] active:text-white hover:bg-[#FF8DA1] hover:text-white md:p-0 md:text-sm md:rounded-none md:bg-transparent md:text-neutral-900 md:hover:text-pink-600 md:hover:bg-transparent">Inicio</a></li>
        <li><a href="catalogo.html" class="block rounded-xl px-5 py-4 text-2xl text-neutral-800 active:bg-[#FF8DA1] active:text-white hover:bg-[#FF8DA1] hover:text-white md:p-0 md:text-sm md:rounded-none md:bg-transparent md:text-neutral-900 md:hover:text-pink-600 md:hover:bg-transparent">Catálogo</a></li>
        <li><a href="solicitudes.html" class="block rounded-xl px-5 py-4 text-2xl text-neutral-800 active:bg-[#FF8DA1] active:text-white hover:bg-[#FF8DA1] hover:text-white md:p-0 md:text-sm md:rounded-none md:bg-transparent md:text-neutral-900 md:hover:text-pink-600 md:hover:bg-transparent">Solicitudes</a></li>
        <li><a href="nosotros.html" class="block rounded-xl px-5 py-4 text-2xl text-neutral-800 active:bg-[#FF8DA1] active:text-white hover:bg-[#FF8DA1] hover:text-white md:p-0 md:text-sm md:rounded-none md:bg-transparent md:text-neutral-900 md:hover:text-pink-600 md:hover:bg-transparent">Acerca de Nosotros</a></li>
      </ul>
    </nav>
  </header>

  <main class="max-w-md mx-auto px-6 py-16">

    <!-- Pestañas -->
    <div class="flex gap-6 border-b border-neutral-200 mb-8">
      <button id="tab-login" class="pb-3 text-sm border-b-2 border-neutral-900">Iniciar sesión</button>
      <button id="tab-registro" class="pb-3 text-sm text-neutral-500 border-b-2 border-transparent">Crear cuenta</button>
    </div>

    <!-- FORMULARIO LOGIN -->
    <form id="form-login" novalidate>
      <label class="block text-sm mb-1">Correo electrónico</label>
      <input type="email" id="login-correo" class="w-full border border-neutral-300 rounded-lg px-3 py-2 mb-1">
      <p class="text-xs text-red-600 mb-3 hidden" id="error-login-correo"></p>

      <label class="block text-sm mb-1">Contraseña</label>
      <input type="password" id="login-password" class="w-full border border-neutral-300 rounded-lg px-3 py-2 mb-1">
      <p class="text-xs text-red-600 mb-3 hidden" id="error-login-password"></p>

      <p class="text-xs text-red-600 mb-3 hidden" id="error-login-general"></p>

      <button type="submit" class="w-full bg-neutral-900 text-white py-3 rounded-full text-sm hover:bg-neutral-700">
        Entrar
      </button>
    </form>

    <!-- FORMULARIO REGISTRO -->
    <form id="form-registro" class="hidden" novalidate>
      <label class="block text-sm mb-1">Nombre completo</label>
      <input type="text" id="reg-nombre" class="w-full border border-neutral-300 rounded-lg px-3 py-2 mb-1">
      <p class="text-xs text-red-600 mb-3 hidden" id="error-reg-nombre"></p>

      <label class="block text-sm mb-1">Correo electrónico</label>
      <input type="email" id="reg-correo" class="w-full border border-neutral-300 rounded-lg px-3 py-2 mb-1">
      <p class="text-xs text-red-600 mb-3 hidden" id="error-reg-correo"></p>

      <label class="block text-sm mb-1">Contraseña</label>
      <input type="password" id="reg-password" class="w-full border border-neutral-300 rounded-lg px-3 py-2 mb-1">
      <p class="text-xs text-neutral-500 mb-1">Mínimo 6 caracteres, una mayúscula y un número.</p>
      <p class="text-xs text-red-600 mb-3 hidden" id="error-reg-password"></p>

      <label class="block text-sm mb-1">Confirmar contraseña</label>
      <input type="password" id="reg-password2" class="w-full border border-neutral-300 rounded-lg px-3 py-2 mb-1">
      <p class="text-xs text-red-600 mb-3 hidden" id="error-reg-password2"></p>

      <button type="submit" class="w-full bg-neutral-900 text-white py-3 rounded-full text-sm hover:bg-neutral-700">
        Crear cuenta
      </button>
    </form>

  </main>

  <script src="js/datos.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
